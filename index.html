<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Live | Success</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="status-icon">✓</div>

        <p class="tagline">SYSTEM STATUS: ONLINE</p>

        <h1>Your Website is <span>Live!</span></h1>

        <p class="description">
            Congratulations! Your website is successfully deployed
            and everything is working as expected.
        </p>

        <div class="status-box">
            <div class="status-item">
                <span class="dot"></span>
                Website Status
                <strong>Operational</strong>
            </div>

            <div class="status-item">
                <span class="dot"></span>
                Server Status
                <strong>Running</strong>
            </div>
        </div>

        <div class="buttons">
            <button class="primary-btn" onclick="alert('Your website is working perfectly!')">
                Test Website
            </button>

            <button class="secondary-btn" onclick="location.reload()">
                Refresh Page
            </button>

            <button class="outline-btn" onclick="window.location.href='mailto:admin@example.com'">
                Contact Us
            </button>
        </div>

        <footer>
            <p>© 2026 | Successfully Deployed 🚀</p>
        </footer>

    </div>

</body>
</html>
